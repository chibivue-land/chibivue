name: Deploy chibivue Book to Pages

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if it's the original repo and the main branch
        run: |
          if [[ "${{ github.repository }}" == "ubugeeei/chibivue" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "This is the original repo's main branch, running the workflow."
          else
            echo "This is a fork or a different branch, skipping the workflow."
            exit 0
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: vp install

      - name: Install Chromium and CJK fonts for OG images
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          vp exec playwright install --with-deps chromium

      - name: Cache OG images
        uses: actions/cache@v4
        with:
          path: book/online-book/.cache
          key: og-images-${{ hashFiles('book/online-book/src/**/*.md', 'book/online-book/theme/og-image.ts') }}
          restore-keys: og-images-

      - name: Build with Ox Content
        run: vp run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/online-book/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
